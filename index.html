<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aposta Brasileirão</title>
<meta name="theme-color" content="#16a34a">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f5f9;--card:#fff;--row:#e2e8f0;--text:#0f172a;--muted:#64748b;--chip:rgba(0,0,0,.08);--accent:#16a34a;--danger:#dc2626;--p2:#16a34a;--p1:#d97706;--p0:#94a3b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--card:#1e293b;--row:#334155;--text:#f8fafc;--muted:#94a3b8;--chip:rgba(0,0,0,.25)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--card:#1e293b;--row:#334155;--text:#f8fafc;--muted:#94a3b8;--chip:rgba(0,0,0,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 14px}
.nr input,.nr textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:8px;border-radius:8px;border:1px solid var(--row);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.nr textarea{min-height:120px}
.nr button{margin-top:10px;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.layout{width:100%;max-width:1040px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:820px){.layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}#roundCard,#newRound{grid-column:1;order:1}#rankCard{grid-column:2;grid-row:1/span 2;order:2;align-self:start;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}}
.card{width:100%;box-sizing:border-box;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
h1{margin:0;font-size:22px}h2{margin:0;font-size:18px}
.sub{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--muted);margin-bottom:14px}
.badge.admin{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:12px;background:var(--row);font-weight:600;font-size:15px}
.row.r1{background:linear-gradient(90deg,#b45309,#d97706);color:#fff;box-shadow:0 4px 12px rgba(217,119,6,.3)}
.row.r2{background:linear-gradient(90deg,#475569,#64748b);color:#fff}
.row.r3{background:linear-gradient(90deg,#7c2d12,#9a3412);color:#fff}
.rn{display:flex;align-items:center;gap:12px;min-width:0}
.rank{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:13px;background:var(--chip)}
.nm{display:flex;flex-direction:column;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.team{font-size:11px;font-weight:500;opacity:.8}
.pts{font-weight:700;font-size:16px;background:var(--chip);padding:4px 10px;border-radius:8px;white-space:nowrap;text-align:right}
.pts small{display:block;font-size:10px;font-weight:600;opacity:.85}
.edit{display:flex;align-items:center;gap:6px}
.edit input,.res input{width:54px;padding:6px;border-radius:8px;border:0;font-size:15px;font-weight:700;text-align:center}
.edit button,.add button,.res button{border:0;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer}
.del{background:var(--danger);color:#fff}
.add{display:flex;gap:6px;margin-top:14px}
.add input{flex:1;min-width:0;padding:9px;border-radius:8px;border:1px solid var(--row);background:var(--bg);color:var(--text);font-size:15px}
.add button{background:var(--accent);color:#fff}
.note{margin-top:12px;color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.game{border:1px solid var(--row);border-radius:14px;padding:12px;margin-top:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
.score{background:var(--chip);border-radius:8px;padding:3px 10px;white-space:nowrap}
.res{display:flex;align-items:center;gap:4px}
.res button{background:var(--row);color:var(--text);padding:6px 8px}
.bets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.bet{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 8px;border-radius:8px;background:var(--row)}
.bet b{font-size:11px;padding:1px 6px;border-radius:99px;color:#fff}
.bet.p2 b{background:var(--p2)}.bet.p1 b{background:var(--p1)}.bet.p0 b{background:var(--p0)}
.res button.sbtn{background:var(--accent);color:#fff;padding:8px 12px}
.res select{max-width:150px}
.auth{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lbtn{border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.sel{background:var(--bg);color:var(--text);border:1px solid var(--row);border-radius:8px;padding:4px 8px;font-size:13px}
</style>
</head>
<body>
<div class="layout">
<div class="card" id="rankCard">
  <div class="header"><h1>⚽ Aposta Brasileirão</h1><span class="sub" id="upd"></span></div>
  <div class="auth"><button class="lbtn" id="loginBtn">Entrar com Google</button><span class="sub" id="who"></span></div>
  <div class="badge" id="role">Somente leitura</div>
  <div class="list" id="list"><div class="empty">Carregando…</div></div>
  <button class="lbtn" id="seedBtn" style="margin-top:14px" hidden>Carregar dados iniciais</button>
  <div class="add" id="add" hidden>
    <input id="newName" placeholder="Novo participante" maxlength="30">
    <button id="addBtn">Adicionar</button>
  </div>
  <div class="note" id="note">Placar exato = 2 pts · acertou só o resultado = 1 pt · empates dividem a posição.</div>
</div>
<div class="card" id="roundCard" hidden>
  <div class="header"><h2 id="rTitle">Rodada</h2><select class="sel" id="rSel"></select></div>
  <div id="games"></div>
</div>
<div class="card nr" id="newRound" hidden>
  <h2>➕ Nova rodada</h2>
  <input id="nrNum" type="number" min="1" placeholder="Número da rodada (ex: 31)">
  <textarea id="nrGames" placeholder="Um jogo por linha:&#10;Flamengo x Botafogo&#10;Palmeiras x Santos&#10;..."></textarea>
  <button id="nrBtn">Criar rodada</button>
  <div class="note" id="nrMsg">Coloque os jogos dos times do grupo e os melhores jogos da rodada (5 no total).</div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
import {firebaseConfig,ADMIN_EMAIL} from "./config.js";
(function(){
  var $=function(i){return document.getElementById(i);};
  var listEl=$('list'),canEdit=false,pCol=null,rCol=null,players=[],rounds=[],cur=null,bCol=null,allBets=[],uid=null,myPid=null,editAs=null;
  function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('p'+Date.now());}
  function parse(s){var m=/^(\d+)x(\d+)$/.exec(s||'');return m?[+m[1],+m[2]]:null;}
  function score(bet,res){var b=parse(bet),r=parse(res);if(!b||!r)return null;if(b[0]===r[0]&&b[1]===r[1])return 2;return Math.sign(b[0]-b[1])===Math.sign(r[0]-r[1])?1:0;}
  function betsOf(r,pid){var m=allBets.filter(function(b){return b.playerId===pid&&b[r.id];})[0];return m?m[r.id]:((r.bets||{})[pid]||[]);}
  function roundPts(r,pid){var t=(r.adj||{})[pid]||0;(r.games||[]).forEach(function(g,i){var s=score(betsOf(r,pid)[i],g.res);if(s)t+=s;});return t;}
  function total(p){var t=p.points;rounds.forEach(function(r){t+=roundPts(r,p.id);});return t;}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function renderRank(){
    listEl.textContent='';
    if(!players.length){listEl.appendChild(el('div','empty','Nenhum participante ainda.'));return;}
    var arr=players.map(function(p){return{p:p,t:total(p)};}).sort(function(a,b){return b.t-a.t||a.p.name.localeCompare(b.p.name);});
    var rank=0,prev=null,lastR=rounds.length?rounds[rounds.length-1]:null;
    arr.forEach(function(x,i){
      var p=x.p;if(x.t!==prev){rank=i+1;prev=x.t;}
      var row=el('div','row'+(rank<=3?' r'+rank:'')),rn=el('div','rn'),nm=el('div','nm');
      rn.appendChild(el('span','rank',rank));nm.appendChild(el('span','name',p.name));
      if(p.team)nm.appendChild(el('span','team',p.team));
      rn.appendChild(nm);row.appendChild(rn);
      if(canEdit){
        var ed=el('div','edit'),inp=el('input');inp.type='number';inp.value=p.points;inp.title='Pontos de antes das rodadas lançadas';
        inp.addEventListener('change',function(){var v=parseInt(inp.value,10);if(isNaN(v)||v===p.points){inp.value=p.points;return;}pCol.doc(p.id).update({points:v,updated:Date.now()}).catch(function(){inp.value=p.points;});});
        var d=el('button','del','✕');d.addEventListener('click',function(){if(confirm('Remover '+p.name+'?'))pCol.doc(p.id).delete();});
        ed.appendChild(el('span','pts',x.t+' pts'));ed.appendChild(inp);ed.appendChild(d);row.appendChild(ed);
      }else{var pt=el('div','pts',x.t+' pts');if(lastR){var rp=roundPts(lastR,p.id);if(rp)pt.appendChild(el('small','','+'+rp+' na rodada'));}row.appendChild(pt);}
      listEl.appendChild(row);
    });
    var last=Math.max.apply(null,players.map(function(p){return p.updated||0;}));
    $('upd').textContent=last?'Atualizado em '+new Date(last).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'';
  }
  function renderRounds(){
    $('roundCard').hidden=!rounds.length;if(!rounds.length)return;
    var sel=$('rSel');sel.textContent='';
    rounds.forEach(function(r){var o=el('option',null,r.number+'ª rodada');o.value=r.id;sel.appendChild(o);});
    if(!cur||!rounds.some(function(r){return r.id===cur;}))cur=rounds[rounds.length-1].id;
    sel.value=cur;var r=rounds.filter(function(x){return x.id===cur;})[0];
    $('rTitle').textContent='Jogos e palpites';
    var g=$('games');g.textContent='';
    (r.games||[]).forEach(function(game,i){
      var box=el('div','game'),h=el('div','gh');h.appendChild(el('span',null,game.home+' x '+game.away));
      var rs=parse(game.res);
      if(canEdit){
        var w=el('div','res'),a=el('input'),b=el('input');a.type=b.type='number';a.min=b.min='0';
        if(rs){a.value=rs[0];b.value=rs[1];}
        var ok=el('button',null,'OK');ok.addEventListener('click',function(){
          if(a.value===''||b.value==='')return;var gs=r.games.map(function(x){return Object.assign({},x);});gs[i].res=(+a.value)+'x'+(+b.value);rCol.doc(r.id).update({games:gs});});
        var cl=el('button',null,'✕');cl.title='Limpar resultado';cl.addEventListener('click',function(){var gs=r.games.map(function(x){return Object.assign({},x);});gs[i].res='';rCol.doc(r.id).update({games:gs});});
        w.appendChild(a);w.appendChild(el('span',null,'x'));w.appendChild(b);w.appendChild(ok);w.appendChild(cl);h.appendChild(w);
      }else h.appendChild(el('span','score',rs?rs[0]+' x '+rs[1]:'a definir'));
      box.appendChild(h);
      var bets=el('div','bets');
      players.forEach(function(p){
        var bt=betsOf(r,p.id)[i];if(!bt)return;var s=score(bt,game.res),hide=!canEdit&&!game.res&&p.id!==myPid;
        var c=el('div','bet'+(s==null?'':' p'+s));c.appendChild(el('span',null,p.name+' '+(hide?'🔒':bt.replace('x','×'))));
        if(s!=null)c.appendChild(el('b',null,'+'+s));bets.appendChild(c);
      });
      box.appendChild(bets);g.appendChild(box);
    });
    renderEntry(r,g);
  }
  function renderEntry(r,g){
    if(!players.length)return;
    var who=canEdit?(editAs||players[0].id):myPid;
    var box=el('div','game');box.appendChild(el('div','gh','✍️ Palpites'));
    if(!uid&&!canEdit){box.appendChild(el('div','note','Entre com o Google para lançar seus palpites.'));g.appendChild(box);return;}
    function picker(txt,fn,btn){
      var w=el('div','res');w.style.marginTop='8px';var s=el('select','sel');
      players.forEach(function(p){var o=el('option',null,p.name);o.value=p.id;s.appendChild(o);});
      if(who)s.value=who;w.appendChild(s);
      if(btn){var b=el('button','sbtn',btn);b.addEventListener('click',function(){fn(s.value);});w.appendChild(b);}
      else s.addEventListener('change',function(){fn(s.value);});
      if(txt)box.appendChild(el('div','note',txt));box.appendChild(w);
    }
    if(!who){picker('Quem é você? Escolha seu nome uma única vez:',function(v){bCol.doc(uid).set({playerId:v});},'Sou eu');g.appendChild(box);return;}
    if(canEdit)picker('Admin: escolha de quem são os palpites.',function(v){editAs=v;renderRounds();});
    var cur0=betsOf(r,who),ins=[];
    (r.games||[]).forEach(function(game,i){
      var row=el('div','bet');row.style.marginTop='6px';row.appendChild(el('span',null,game.home+' x '+game.away));
      var rr=el('div','res'),a=el('input'),b=el('input'),pv=parse(cur0[i]),lock=!!game.res&&!canEdit;
      a.type=b.type='number';a.min=b.min='0';if(pv){a.value=pv[0];b.value=pv[1];}
      a.disabled=b.disabled=lock;rr.appendChild(a);rr.appendChild(el('span',null,'x'));rr.appendChild(b);row.appendChild(rr);box.appendChild(row);ins.push([a,b]);
    });
    var sv=el('button','sbtn','Salvar palpites'),w=el('div','res');w.style.marginTop='10px';w.appendChild(sv);box.appendChild(w);
    sv.addEventListener('click',function(){
      var arr=ins.map(function(x,i){return(x[0].value!==''&&x[1].value!=='')?(+x[0].value)+'x'+(+x[1].value):(cur0[i]||'');});
      var m=allBets.filter(function(bb){return bb.playerId===who&&bb[r.id];})[0],o={};
      if(canEdit){
        if(m){o[r.id]=arr;bCol.doc(m.uid).update(o);}
        else{var nb=Object.assign({},r.bets||{});nb[who]=arr;rCol.doc(r.id).update({bets:nb});}
      }else{
        var mine=allBets.filter(function(bb){return bb.uid===uid;})[0]||{};
        var d={playerId:who};Object.keys(mine).forEach(function(k){if(k!=='uid')d[k]=mine[k];});d[r.id]=arr;bCol.doc(uid).set(d);
      }
      sv.textContent='Salvo ✓';
    });
    g.appendChild(box);
    if(canEdit){
      var ab=el('div','game');ab.appendChild(el('div','gh','🛠 Ajuste manual de pontos (nesta rodada)'));var gr=el('div','bets');
      players.forEach(function(p){var c=el('div','bet');c.appendChild(el('span',null,p.name));var inp=el('input');inp.type='number';inp.value=(r.adj||{})[p.id]||0;inp.style.width='52px';
        inp.addEventListener('change',function(){var a=Object.assign({},r.adj||{});a[p.id]=parseInt(inp.value,10)||0;rCol.doc(r.id).update({adj:a});});c.appendChild(inp);gr.appendChild(c);});
      ab.appendChild(gr);g.appendChild(ab);
    }
  }
  function renderAll(){renderRank();if(!(document.activeElement&&document.activeElement.tagName==='INPUT'&&$('games').contains(document.activeElement)))renderRounds();}
  $('rSel').addEventListener('change',function(){cur=this.value;renderRounds();});
  $('nrBtn').addEventListener('click',function(){
    var n=parseInt($('nrNum').value,10),msg=$('nrMsg');
    var gs=$('nrGames').value.split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){var m=l.split(/\s+[xX×]\s+/);return m.length===2&&m[0]&&m[1]?{home:m[0].trim(),away:m[1].trim(),res:''}:null;});
    if(!n||!gs.length||gs.indexOf(null)>-1){msg.textContent='Informe o número da rodada e um jogo por linha, no formato: Time x Time.';return;}
    var id='r'+n;
    if(rounds.some(function(r){return r.id===id;})&&!confirm('A rodada '+n+' já existe. Substituir? Isso apaga resultados e palpites dela.'))return;
    rCol.doc(id).set({number:n,games:gs,bets:{},adj:{}}).then(function(){cur=id;$('nrGames').value='';$('nrNum').value='';msg.textContent='Rodada '+n+' criada com '+gs.length+' jogos.';}).catch(function(){msg.textContent='Não foi possível criar a rodada.';});
  });
  $('addBtn').addEventListener('click',function(){var e=$('newName'),n=e.value.trim();if(!n||!pCol)return;pCol.doc(slug(n)).set({name:n,points:0,updated:Date.now()}).then(function(){e.value='';});});
  var fapp=initializeApp(firebaseConfig),fdb=getFirestore(fapp),auth=getAuth(fapp);
  var defNote=$('note').textContent;
  function wrap(name){return{
    doc:function(id){var r=doc(fdb,name,id);return{set:function(d){return setDoc(r,d);},update:function(d){return updateDoc(r,d);},delete:function(){return deleteDoc(r);}};},
    onSnapshot:function(ok,err){return onSnapshot(collection(fdb,name),ok,err);}};}
  pCol=wrap('players');rCol=wrap('rounds');bCol=wrap('bets');
  function seedVis(){$('seedBtn').hidden=!(canEdit&&!players.length&&!rounds.length);}
  function applyAuth(u){
    uid=u?u.uid:null;
    canEdit=!!u&&!!u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
    $('who').textContent=u?(u.displayName||u.email):'';
    $('loginBtn').textContent=u?'Sair':'Entrar com Google';
    $('add').hidden=!canEdit;$('newRound').hidden=!canEdit;
    $('role').textContent=canEdit?'Administrador':(u?'Participante':'Somente leitura');
    $('role').className='badge'+(canEdit?' admin':'');
    $('note').textContent=canEdit?'Admin: lance o resultado de cada jogo e os pontos são calculados sozinhos. O campo ao lado de cada nome são os pontos de antes das rodadas lançadas.':defNote;
    var me=allBets.filter(function(b){return b.uid===uid;})[0];myPid=me?me.playerId:null;
    renderAll();seedVis();
  }
  $('loginBtn').addEventListener('click',function(){
    if(auth.currentUser)signOut(auth);else signInWithPopup(auth,new GoogleAuthProvider()).catch(function(e){alert('Não foi possível entrar: '+(e&&e.code?e.code:e));});
  });
  $('seedBtn').addEventListener('click',function(){
    import('./seed.js').then(function(m){
      var S=m.SEED,ps=[];
      Object.keys(S.players).forEach(function(id){ps.push(pCol.doc(id).set(S.players[id]));});
      Object.keys(S.rounds).forEach(function(id){ps.push(rCol.doc(id).set(S.rounds[id]));});
      return Promise.all(ps);
    }).then(function(){$('seedBtn').hidden=true;}).catch(function(e){alert('Erro ao carregar os dados: '+(e&&e.code?e.code:e));});
  });
  bCol.onSnapshot(function(s){allBets=s.docs.map(function(d){var x=Object.assign({},d.data()||{});x.uid=d.id;return x;});var me=allBets.filter(function(b){return b.uid===uid;})[0];myPid=me?me.playerId:null;renderAll();},function(){});
  pCol.onSnapshot(function(s){players=s.docs.map(function(d){var x=d.data()||{};return{id:d.id,name:String(x.name||d.id),team:x.team||'',points:Number(x.points)||0,updated:x.updated||0};});renderAll();seedVis();},
    function(){listEl.innerHTML='<div class="empty">Não foi possível carregar o ranking.</div>';});
  rCol.onSnapshot(function(s){rounds=s.docs.map(function(d){var x=d.data()||{};return{id:d.id,number:x.number||0,games:x.games||[],bets:x.bets||{},adj:x.adj||{}};}).sort(function(a,b){return a.number-b.number;});renderAll();seedVis();},function(){});
  onAuthStateChanged(auth,applyAuth);
})();
</script>
</body>
</html>
